<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exam Hub</title>
<meta name="description" content="Practice exams and drills for Microsoft Fabric (DP-700, DP-600) and Databricks (Data Engineer Associate) certifications.">
<meta name="theme-color" content="#0d6b5b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Exam Hub">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
</head>
<body>

<div class="bar"><div class="bar-in">
  <button class="brand" id="brand">Exam Hub<small id="secname">Microsoft Fabric Data Engineer Associate</small></button>
  <nav class="views" id="views" aria-label="Views"><button data-view="exams" aria-pressed="true">Exams</button><button data-view="hist" aria-pressed="false">History</button><button data-view="svc" aria-pressed="false">Service map</button><button data-view="mon" aria-pressed="false">Monitoring map</button><button data-view="stem" aria-pressed="false">Stem decoder</button></nav>
  <div class="pills" id="pills"></div>
  <div class="spacer"></div>
  <span class="prog" id="prog"></span>
  <button class="btn small ghost" id="menu" hidden>Menu</button>
  <button class="btn small ghost" id="backup" title="Sync and back up your progress">Progress<small id="syncMark" aria-hidden="true"></small></button>
</div></div>
<main id="app"></main>
<div id="frames"></div>

<dialog id="backupDlg" class="dlg" aria-labelledby="bkTitle">
 <form method="dialog" class="stack">
  <h2 id="bkTitle">Sync and back up</h2>
  <section id="syncBox" class="stack" style="gap:10px">
   <h3>Cloud sync</h3>
   <p class="meta" id="syncState" role="status"></p>
   <div id="syncCfg" class="stack" style="gap:8px" hidden>
    <label class="meta" for="syncUrl">Project URL</label>
    <input type="url" id="syncUrl" placeholder="https://your-project.supabase.co" autocomplete="off">
    <label class="meta" for="syncKey">Anon (public) key</label>
    <input type="text" id="syncKey" placeholder="eyJ..." autocomplete="off" spellcheck="false">
    <div class="row"><button type="button" class="btn" id="syncSave">Save server</button></div>
   </div>
   <div id="syncAuth" class="stack" style="gap:8px" hidden>
    <label class="meta" for="syncEmail">Email</label>
    <input type="email" id="syncEmail" autocomplete="username" inputmode="email">
    <label class="meta" for="syncPass">Password</label>
    <input type="password" id="syncPass" autocomplete="current-password">
    <div class="row"><button type="button" class="btn primary" id="syncSignIn">Sign in</button><button type="button" class="btn" id="syncSignUp">Create account</button></div>
   </div>
   <div id="syncUser" class="row" hidden><button type="button" class="btn" id="syncNow">Sync now</button><button type="button" class="btn ghost" id="syncOut">Sign out</button></div>
   <p class="meta" id="syncMsg" role="status"></p>
   <button type="button" class="btn small ghost" id="syncChange" style="align-self:flex-start" hidden>Change server</button>
  </section>
  <h3>Manual backup</h3>
  <p class="meta">Prefer files? Export here and import on another device. Importing merges your history rather than replacing it.</p>
  <div class="row"><button type="button" class="btn primary" id="bkExport">Export to file</button><button type="button" class="btn" id="bkCopy">Copy as text</button></div>
  <label class="meta" for="bkText">Import: choose a file or paste exported text</label>
  <input type="file" id="bkFile" accept="application/json,.json">
  <textarea id="bkText" rows="4" placeholder='{"dp700-hub-e1": ...}'></textarea>
  <p class="meta" id="bkMsg" role="status"></p>
  <div class="row"><button type="button" class="btn" id="bkImport">Import</button><span class="spacer"></span><button class="btn ghost" value="close">Close</button></div>
 </form>
</dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
